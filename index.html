<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoseNet — Real-Time Pose Estimation</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- p5.js and ml5.js libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script src="main.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="3"></circle>
          <line x1="12" y1="8" x2="12" y2="15"></line>
          <line x1="6" y1="12" x2="18" y2="12"></line>
          <line x1="12" y1="15" x2="8" y2="21"></line>
          <line x1="12" y1="15" x2="16" y2="21"></line>
        </svg>
      </div>
      <h1 class="brand-title">
        PoseNet
        <span class="brand-badge">Vision AI</span>
      </h1>
    </div>

    <div class="header-status">
      <div id="status-pill" class="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Loading Model...</span>
      </div>
    </div>
  </header>

  <!-- Main Viewport & Controls -->
  <main class="app-main">
    <div class="viewport-card">
      <div id="canvas-container">
        <!-- p5 canvas attaches here -->
        
        <!-- Camera & Model Loading Placeholder -->
        <div id="canvas-loader" class="canvas-loader">
          <div class="spinner"></div>
          <p class="loader-text">Initializing camera & PoseNet...</p>
        </div>

        <!-- Snapshot Flash Overlay -->
        <div id="snapshot-flash" class="snapshot-flash"></div>
      </div>
    </div>

    <!-- Controls Toolbar -->
    <div class="controls-bar">
      <button id="toggle-skeleton-btn" class="control-btn active" title="Toggle Skeleton Lines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="9" x2="20" y2="9"></line>
          <line x1="4" y1="15" x2="20" y2="15"></line>
          <line x1="10" y1="3" x2="8" y2="21"></line>
          <line x1="16" y1="3" x2="14" y2="21"></line>
        </svg>
        <span>Skeleton</span>
      </button>

      <button id="toggle-keypoints-btn" class="control-btn active" title="Toggle Keypoints">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <circle cx="6" cy="6" r="2"></circle>
          <circle cx="18" cy="6" r="2"></circle>
          <circle cx="6" cy="18" r="2"></circle>
          <circle cx="18" cy="18" r="2"></circle>
        </svg>
        <span>Keypoints</span>
      </button>

      <button id="toggle-mirror-btn" class="control-btn active" title="Flip Horizontal Mirror">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <span>Mirror</span>
      </button>

      <button id="toggle-multipose-btn" class="control-btn active" title="Toggle Multi-Person Detection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Multi-Person</span>
      </button>

      <div class="divider"></div>

      <button id="snapshot-btn" class="control-btn snapshot-btn" title="Download Canvas Snapshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Capture</span>
      </button>
    </div>

    <!-- Live Telemetry / Detection Info -->
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span>FPS:</span>
        <span id="fps-val" class="val">--</span>
      </div>
      <div class="telemetry-item">
        <span>Persons:</span>
        <span id="persons-val" class="val">0</span>
      </div>
      <div class="telemetry-item">
        <span>Confidence:</span>
        <span id="confidence-val" class="val">--%</span>
      </div>
      <div class="telemetry-item">
        <span>Keypoints:</span>
        <span id="keypoints-val" class="val">0</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <span>PoseNet Demo &bull; Powered by ml5.js & p5.js</span>
    <span>Ready for deployment</span>
  </footer>

</body>
</html>
